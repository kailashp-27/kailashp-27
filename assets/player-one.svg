<text x="32" y="123" fill="#e7e8ef" font-size="18" >I’m Kailash, a third-year B.Tech CSE (AI &amp; Robotics)</text>
<text x="32" y="152" fill="#e7e8ef" font-size="18" >student at VIT Chennai who loves coding. I’m drawn to</text>
<text x="32" y="181" fill="#e7e8ef" font-size="18" >websites with great UI, and I’m learning to build them myself.</text>
<text x="32" y="210" fill="#e7e8ef" font-size="18" ></text>
<text x="32" y="239" fill="#e7e8ef" font-size="18" >Frontend UI is the part I enjoy most. I’m still learning</text>
<text x="32" y="268" fill="#e7e8ef" font-size="18" >how to make a page look better, feel better, and be easier to use.</text><text x="32" y="321" fill="#8be5c2" font-size="14" >BUILDING</text><text x="170" y="321" fill="#e7e8ef" font-size="18" >ForenSight + Code Clash</text><text x="32" y="353" fill="#8be5c2" font-size="14" >CURRENT QUEST</text><text x="170" y="353" fill="#e7e8ef" font-size="18" >DSA practice + keeping my LeetCode streak</text><text x="32" y="385" fill="#8be5c2" font-size="14" >PARTY INVITE</text><text x="170" y="385" fill="#e7e8ef" font-size="18" >Fellow developers — let’s build together</text><text x="32" y="420" fill="#f6df9c" font-size="16" >College work + personal builds. Each one teaches me something new.</text></g></svg>
